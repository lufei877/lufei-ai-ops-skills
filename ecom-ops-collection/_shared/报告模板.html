<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店铺经营周报</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af; --line:#e5e7eb;
  --brand:#2563eb; --brand-soft:#dbeafe; --up:#059669; --down:#dc2626; --warn:#d97706; --warn-soft:#fef3c7;
  --c1:#2563eb; --c2:#0d9488; --c3:#7c3aed; --c4:#ea580c; --c5:#64748b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
.sub{color:var(--ink2);font-size:13px}
.tag{display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:12px;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.kpi .k{color:var(--ink2);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:14px 16px}
.card.wide{grid-column:1/-1}
.card h2{font-size:15px;margin:0}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card .note{color:var(--ink2);font-size:12px;margin:0 0 6px}
svg{width:100%;height:auto;display:block}
.advice{margin:0;padding-left:20px}
.advice li{margin:6px 0}
.advice b{color:var(--ink)}
.lvl{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;margin-right:6px;color:#fff}
.p0{background:var(--down)} .p1{background:var(--warn)} .p2{background:var(--c5)}
footer{margin-top:18px;text-align:center;color:var(--ink3);font-size:11px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kpi .v{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>店铺经营周报<span class="tag">示例数据</span></h1>
      <div class="sub">示例小家电店 · 2026-11-03 ～ 11-09 · 对比上周</div>
    </div>
    <button class="btn" id="csv">下载数据表（Excel 可打开）</button>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card wide">
      <div class="hd"><h2>结论和下一步</h2></div>
      <ol class="advice">
        <li><span class="lvl p0">先做</span><b>加购到下单只有 31.9%</b>：1560 人加购，只有 498 人下单，先查优惠券门槛和运费设置。</li>
        <li><span class="lvl p1">本周</span><b>小电煮锅占销售额 32.9%</b>：一个商品撑了三成，盯紧库存和新差评。</li>
        <li><span class="lvl p2">观察</span><b>转化率连涨 4 天，周日 3.95% 最高</b>：下周周末推广加一点预算试试，看能不能保持。</li>
      </ol>
    </div>
    <div class="card" data-share="购买漏斗">
      <div class="hd"><h2>购买漏斗</h2><button class="btn share">分享这张图</button></div>
      <p class="note">每一步留下多少人；红色是本周要先处理的一步（宽度按比例压缩显示）</p>
      <svg id="funnel" viewBox="0 0 520 260"></svg>
    </div>
    <div class="card" data-share="每日支付转化率">
      <div class="hd"><h2>每日支付转化率</h2><button class="btn share">分享这张图</button></div>
      <p class="note">支付买家数 ÷ 当天访客数</p>
      <svg id="trend" viewBox="0 0 520 260"></svg>
    </div>
    <div class="card wide" data-share="商品销售额排行">
      <div class="hd"><h2>商品销售额排行</h2><button class="btn share">分享这张图</button></div>
      <p class="note">本周支付金额，单位：元</p>
      <svg id="bars" viewBox="0 0 1040 230"></svg>
    </div>
  </section>

  <footer>路飞的AI运营笔记</footer>
</div>

<script>
const BADGE = '路飞的AI运营笔记';
const D = {
  kpi: [
    {k:'访客数', v:12480, p:11900, f:v=>v.toLocaleString()},
    {k:'支付转化率', v:3.62, p:3.40, f:v=>v.toFixed(2)+'%', pt:true},
    {k:'客单价', v:86.5, p:84.2, f:v=>'¥'+v.toFixed(1)},
    {k:'支付金额', v:39098, p:34101, f:v=>'¥'+v.toLocaleString()},
  ],
  funnel: [['访客',12480],['加购',1560],['下单',498],['支付',452]],
  days: ['周一','周二','周三','周四','周五','周六','周日'],
  uv:   [1650,1720,1580,1800,1760,1920,2050],
  paid: [55,60,54,66,64,72,81],
  goods:[['小电煮锅',12860],['便携榨汁杯',9420],['迷你电饭煲',7350],['煎烤盘',5610],['养生壶',3858]],
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NS='http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;parent&&parent.appendChild(e);return e;}

// KPI 卡
const kp=document.getElementById('kpis');
D.kpi.forEach(o=>{
  const diff=o.pt?(o.v-o.p):(o.v/o.p-1)*100, up=diff>=0;
  const dt=o.pt?`${up?'+':''}${diff.toFixed(2)} 个百分点`:`${up?'+':''}${diff.toFixed(1)}%`;
  kp.insertAdjacentHTML('beforeend',`<div class="kpi"><div class="k">${o.k}</div><div class="v">${o.f(o.v)}</div><div class="d ${up?'up':'down'}">${up?'▲':'▼'} ${dt}　<span style="color:var(--ink3)">上周 ${o.f(o.p)}</span></div></div>`);
});

// 漏斗
(function(){
  const s=document.getElementById('funnel'), W=520, top=10, h=50, gap=12, max=D.funnel[0][1];
  const worst=2; // 加购→下单：和结论第 1 条对应
  D.funnel.forEach(([name,v],i)=>{
    const w=360*Math.pow(v/max,0.4), x=(W-w)/2+40, y=top+i*(h+gap);
    el('rect',{x,y,width:w,height:h,rx:6,fill:i===worst?css('--down'):css('--c1'),opacity:1-i*0.12},s);
    el('text',{x:10,y:y+h/2+5,'font-size':14,fill:css('--ink2')},s,name);
    el('text',{x:x+w/2,y:y+h/2+5,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#fff'},s,v.toLocaleString());
    if(i>0){const r=(v/D.funnel[i-1][1]*100).toFixed(1)+'%';
      el('text',{x:W-6,y:y+h/2+5,'text-anchor':'end','font-size':13,fill:i===worst?css('--down'):css('--ink2'),'font-weight':i===worst?700:400},s,'留下 '+r);}
  });
})();

// 趋势
(function(){
  const s=document.getElementById('trend'), L=46,R=500,T=20,B=220, rate=D.uv.map((u,i)=>D.paid[i]/u*100);
  const lo=3.0, hi=4.2, X=i=>L+i*(R-L)/(rate.length-1), Y=v=>B-(v-lo)/(hi-lo)*(B-T);
  for(let v=3.0;v<=4.2001;v+=0.4){el('line',{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:css('--line')},s);el('text',{x:L-8,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:css('--ink3')},s,v.toFixed(1)+'%');}
  const avg=D.paid.reduce((a,b)=>a+b)/D.uv.reduce((a,b)=>a+b)*100;
  el('line',{x1:L,x2:R,y1:Y(avg),y2:Y(avg),stroke:css('--ink3'),'stroke-dasharray':'4 4'},s);
  el('text',{x:R,y:Y(avg)-6,'text-anchor':'end','font-size':11,fill:css('--ink3')},s,'本周平均 '+avg.toFixed(2)+'%');
  el('path',{d:rate.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ')+` L${R} ${B} L${L} ${B} Z`,fill:css('--brand-soft'),opacity:.6},s);
  el('path',{d:rate.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' '),fill:'none',stroke:css('--c1'),'stroke-width':3},s);
  rate.forEach((v,i)=>{
    el('circle',{cx:X(i),cy:Y(v),r:i===6?6:4,fill:i===6?css('--c1'):'#fff',stroke:css('--c1'),'stroke-width':2},s);
    el('text',{x:X(i),y:B+18,'text-anchor':'middle','font-size':12,fill:css('--ink2')},s,D.days[i]);
    if(i===6||i===0)el('text',{x:X(i)+(i===0?14:0),y:i===0?Y(v)+22:Y(v)-12,'text-anchor':'middle','font-size':12,'font-weight':700,fill:css('--ink')},s,v.toFixed(2)+'%');
  });
})();

// 排行
(function(){
  const s=document.getElementById('bars'), L=110, R=900, bh=30, gap=12, max=D.goods[0][1], total=D.goods.reduce((a,g)=>a+g[1],0);
  D.goods.forEach(([n,v],i)=>{
    const y=10+i*(bh+gap), w=(v/max)*(R-L);
    el('text',{x:L-10,y:y+bh/2+5,'text-anchor':'end','font-size':13,fill:css('--ink2')},s,n);
    el('rect',{x:L,y,width:w,height:bh,rx:4,fill:i===0?css('--c1'):css('--c5'),opacity:i===0?1:.55},s);
    el('text',{x:L+w+8,y:y+bh/2+5,'font-size':13,'font-weight':700,fill:css('--ink')},s,v.toLocaleString());
    el('text',{x:1030,y:y+bh/2+5,'text-anchor':'end','font-size':12,fill:css('--ink3')},s,'占 '+(v/total*100).toFixed(1)+'%');
  });
})();

// 分享：把这张图导出成图片，右下角带小标识
document.querySelectorAll('.share').forEach(b=>b.addEventListener('click',async()=>{
  const card=b.closest('.card'), svg=card.querySelector('svg'), title=card.dataset.share;
  const vb=svg.viewBox.baseVal, scale=1080/vb.width, pad=48, headH=90, footH=56;
  const cw=1080+pad*2, ch=vb.height*scale+headH+footH+pad;
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,cw,ch);
  g.fillStyle=css('--ink'); g.font='bold 36px "PingFang SC","Microsoft YaHei",sans-serif'; g.fillText(title,pad,pad+30);
  g.fillStyle=css('--ink3'); g.font='22px "PingFang SC","Microsoft YaHei",sans-serif'; g.fillText(document.querySelector('.sub').textContent+' · 示例数据',pad,pad+64);
  const clone=svg.cloneNode(true); clone.setAttribute('xmlns',NS); clone.setAttribute('width',vb.width); clone.setAttribute('height',vb.height);
  clone.setAttribute('font-family','PingFang SC, Microsoft YaHei, sans-serif');
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));
  const img=new Image(); img.onload=()=>{
    g.drawImage(img,pad,headH+pad/2,vb.width*scale,vb.height*scale); URL.revokeObjectURL(url);
    g.fillStyle=css('--ink3'); g.font='20px "PingFang SC","Microsoft YaHei",sans-serif'; g.textAlign='right'; g.fillText(BADGE,cw-pad/2,ch-pad/2);
    c.toBlob(async blob=>{
      const file=new File([blob],title+'.png',{type:'image/png'});
      try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return;} }catch(e){}
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=title+'.png'; a.click();
    },'image/png');
  }; img.src=url;
}));

// 数据表：同一份数据导出 CSV，Excel 直接打开
document.getElementById('csv').addEventListener('click',()=>{
  const rows=[['日期','访客数','支付买家数','支付转化率']];
  D.days.forEach((d,i)=>rows.push([d,D.uv[i],D.paid[i],(D.paid[i]/D.uv[i]*100).toFixed(2)+'%']));
  rows.push([]); rows.push(['商品','支付金额']); D.goods.forEach(g=>rows.push(g));
  rows.push([]); rows.push(['来源',BADGE]);
  const blob=new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='店铺经营周报-示例.csv'; a.click();
});
</script>
</body>
</html>
