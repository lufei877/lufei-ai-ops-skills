<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店铺经营周报</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--ink2:#4b5563;--ink3:#9ca3af;--line:#e5e7eb;--brand:#2563eb;--soft:#dbeafe;--up:#059669;--down:#dc2626;--warn:#d97706}
*{box-sizing:border-box}body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px 16px 40px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:22px;margin:0}.sub{color:var(--ink2);font-size:13px}.tag{display:inline-block;background:#fef3c7;color:var(--warn);font-size:12px;padding:1px 8px;border-radius:10px;margin-left:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:10px}.kpi{padding:14px 16px}.kpi .k{color:var(--ink2);font-size:12px}.kpi .v{font-size:26px;font-weight:700}.up{color:var(--up)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}.card{padding:14px 16px;min-width:0}.wide{grid-column:1/-1}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.card h2{font-size:15px;margin:0}.note{color:var(--ink2);font-size:12px;margin:0 0 6px}svg{width:100%;height:auto;display:block}.advice{margin:0;padding-left:20px}.advice li{margin:6px 0}.lvl{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;margin-right:6px}.p0{background:var(--down)}.p1{background:var(--warn)}.p2{background:#64748b}footer{margin-top:18px;text-align:center;color:var(--ink3);font-size:11px}@media(max-width:1000px){.wrap{max-width:100%;overflow-x:hidden}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}.grid{grid-template-columns:minmax(0,1fr);min-width:0}.kpi,.card{min-width:0}.kpi .v{font-size:22px}svg{max-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>店铺经营周报<span class="tag">示例数据</span></h1><div class="sub">示例小家电店 · 2026-11-03 ～ 11-09 · 对比上周</div></div><button class="btn" id="csv">下载数据表（Excel 可打开）</button></header>
<section class="kpis" id="kpis"></section>
<section class="grid">
<div class="card wide"><div class="hd"><h2>结论和下一步</h2></div><ol class="advice"><li><span class="lvl p0">先做</span><b>加购到下单只有 31.9%</b>：1560 人加购，只有 498 人下单，先查优惠券门槛和运费设置。</li><li><span class="lvl p1">本周</span><b>小电煮锅占销售额 32.9%</b>：一个商品撑了三成，盯紧库存和新差评。</li><li><span class="lvl p2">观察</span><b>转化率连涨 4 天，周日 3.95% 最高</b>：下周周末推广加一点预算试试，看能不能保持。</li></ol></div>
<div class="card" data-share="购买漏斗"><div class="hd"><h2>购买漏斗</h2><button class="btn share">分享这张图</button></div><p class="note">每一步留下多少人；红色是本周要先处理的一步</p><svg id="funnel" viewBox="0 0 520 260"></svg></div>
<div class="card" data-share="每日支付转化率"><div class="hd"><h2>每日支付转化率</h2><button class="btn share">分享这张图</button></div><p class="note">支付买家数 ÷ 当天访客数</p><svg id="trend" viewBox="0 0 520 260"></svg></div>
<div class="card wide" data-share="商品销售额排行"><div class="hd"><h2>商品销售额排行</h2><button class="btn share">分享这张图</button></div><p class="note">本周支付金额，单位：元</p><svg id="bars" viewBox="0 0 1040 230"></svg></div>
</section><footer>路飞的AI运营笔记</footer></div>
<script>
const BADGE='路飞的AI运营笔记',NS='http://www.w3.org/2000/svg',D={kpi:[['访客数',12480,11900],['支付转化率',3.62,3.40,'%'],['客单价',86.5,84.2,'¥'],['支付金额',39098,34101,'¥']],funnel:[['访客',12480],['加购',1560],['下单',498],['支付',452]],days:['周一','周二','周三','周四','周五','周六','周日'],uv:[1650,1720,1580,1800,1760,1920,2050],paid:[55,60,54,66,64,72,81],goods:[['小电煮锅',12860],['便携榨汁杯',9420],['迷你电饭煲',7350],['煎烤盘',5610],['养生壶',3858]]};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),el=(t,a,p,x)=>{const e=document.createElementNS(NS,t);Object.keys(a).forEach(k=>e.setAttribute(k,a[k]));if(x!=null)e.textContent=x;p.appendChild(e);return e};
D.kpi.forEach(o=>{const d=o[3]==='%'?o[1]-o[2]:(o[1]/o[2]-1)*100;document.getElementById('kpis').insertAdjacentHTML('beforeend','<div class="kpi"><div class="k">'+o[0]+'</div><div class="v">'+(o[3]==='%'?o[1].toFixed(2)+'%':o[3]==='¥'?'¥'+o[1].toLocaleString():o[1].toLocaleString())+'</div><div class="up">▲ '+(o[3]==='%'?d.toFixed(2)+' 个百分点':'+'+d.toFixed(1)+'%')+'　<span style="color:var(--ink3)">上周 '+o[2]+'</span></div></div>')});
(function(){const s=document.getElementById('funnel'),max=D.funnel[0][1];D.funnel.forEach((v,i)=>{const w=360*Math.pow(v[1]/max,.4),x=(520-w)/2+40,y=10+i*62;el('rect',{x:x,y:y,width:w,height:50,rx:6,fill:i===2?css('--down'):css('--brand'),opacity:1-i*.12},s);el('text',{x:10,y:y+30,fill:css('--ink2')},s,v[0]);el('text',{x:x+w/2,y:y+30,'text-anchor':'middle',fill:'#fff','font-weight':700},s,v[1].toLocaleString());if(i)el('text',{x:514,y:y+30,'text-anchor':'end',fill:i===2?css('--down'):css('--ink2')},s,'留下 '+(v[1]/D.funnel[i-1][1]*100).toFixed(1)+'%')})})();
(function(){const s=document.getElementById('trend'),L=46,R=500,T=20,B=220,r=D.uv.map((u,i)=>D.paid[i]/u*100),X=i=>L+i*(R-L)/6,Y=v=>B-(v-3)/(1.2)*(B-T);for(let v=3;v<=4.2;v+=.4){el('line',{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:css('--line')},s);el('text',{x:L-8,y:Y(v)+4,'text-anchor':'end',fill:css('--ink3')},s,v.toFixed(1)+'%')}el('path',{d:r.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' '),fill:'none',stroke:css('--brand'),'stroke-width':3},s);r.forEach((v,i)=>{el('circle',{cx:X(i),cy:Y(v),r:i===6?6:4,fill:'#fff',stroke:css('--brand'),'stroke-width':2},s);el('text',{x:X(i),y:B+18,'text-anchor':'middle',fill:css('--ink2')},s,D.days[i]);if(i===0||i===6)el('text',{x:X(i),y:Y(v)-12,'text-anchor':'middle','font-weight':700},s,v.toFixed(2)+'%')})})();
(function(){const s=document.getElementById('bars'),L=110,R=900,max=D.goods[0][1],total=D.goods.reduce((a,g)=>a+g[1],0);D.goods.forEach((g,i)=>{const y=10+i*42,w=g[1]/max*(R-L);el('text',{x:L-10,y:y+20,'text-anchor':'end',fill:css('--ink2')},s,g[0]);el('rect',{x:L,y:y,width:w,height:30,rx:4,fill:i? '#64748b':css('--brand'),opacity:i?'.55':'1'},s);el('text',{x:L+w+8,y:y+20,'font-weight':700},s,g[1].toLocaleString());el('text',{x:1030,y:y+20,'text-anchor':'end',fill:css('--ink3')},s,'占 '+(g[1]/total*100).toFixed(1)+'%')})})();
document.getElementById('csv').onclick=()=>{const rows=[['日期','访客数','支付买家数','支付转化率']];D.days.forEach((d,i)=>rows.push([d,D.uv[i],D.paid[i],(D.paid[i]/D.uv[i]*100).toFixed(2)+'%']));rows.push([]);rows.push(['商品','支付金额']);D.goods.forEach(g=>rows.push(g));rows.push([]);rows.push(['来源',BADGE]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv'}));a.download='店铺经营周报-示例.csv';a.click()};
document.querySelectorAll('.share').forEach(b=>b.onclick=()=>{const card=b.closest('.card'),svg=card.querySelector('svg'),clone=svg.cloneNode(true),mark=document.createElementNS(NS,'text');mark.setAttribute('x','500');mark.setAttribute('y','250');mark.setAttribute('text-anchor','end');mark.setAttribute('font-size','11');mark.setAttribute('fill','#9ca3af');mark.textContent=BADGE;clone.appendChild(mark);const a=document.createElement('a');a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));a.download=card.dataset.share+'-示例.svg';a.click()});
</script>
</body>
</html>
